const diseaseSel = document.getElementById("diseaseSel");
const vaccName = document.getElementById("vaccName");
const pieCanvas = document.getElementById("pieCanvas");
const ctx = pieCanvas.getContext("2d");
// 饼图配色
const pieColors = ["#2563eb","#16a34a","#f97316","#ef4444","#8b5cf6"];

// 初始化下拉框（疾病列表）
function initSelect(){
    diseaseSel.innerHTML = "";
    disease_db.forEach((d,i)=>{
        let opt = document.createElement("option");
        opt.value = i;
        opt.text = d.name;
        diseaseSel.appendChild(opt);
    });
    showVaccineName();
    clearPie();
}
function showVaccineName(){
    let d = disease_db[Number(diseaseSel.value)];
    vaccName.textContent = d.vaccine_name + (d.has_vaccine?"（有疫苗）":"（无疫苗）");
}
//清空画布
function clearPie(){
    ctx.clearRect(0,0,pieCanvas.width,pieCanvas.height);
}
//绘制饼图函数
function drawPie(dataList){
    clearPie();
    const cx = 150;
    const cy =150;
    const r = 110;
    let totalVal = dataList.reduce((sum,item)=>sum+item.percent,0);
    let startAngle = 0;
    dataList.forEach((item,idx)=>{
        let sliceAngle = 2 * Math.PI * (item.percent / totalVal);
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,r,startAngle,startAngle+sliceAngle);
        ctx.closePath();
        ctx.fillStyle = pieColors[idx % pieColors.length];
        ctx.fill();
        ctx.strokeStyle="#fff";
        ctx.lineWidth=2;
        ctx.stroke();
        // 文字标签
        let midAngle = startAngle + sliceAngle/2;
        let labelR = r +20;
        let lx = cx + Math.cos(midAngle)*labelR;
        let ly = cy + Math.sin(midAngle)*labelR;
        ctx.fillStyle="#111";
        ctx.font="13px system-ui";
        ctx.fillText(`${item.name} ${item.percent}%`,lx,ly);
        startAngle += sliceAngle;
    })
}

// 1. 统计数据库
function countDB(){
    let total=disease_db.length;
    let a=disease_db.filter(d=>d.category==="甲类").length;
    let b=disease_db.filter(d=>d.category==="乙类").length;
    let c=disease_db.filter(d=>d.category==="丙类").length;
    let vac=disease_db.filter(d=>d.has_vaccine).length;
    document.getElementById("res-stat").innerText = `==== 传染病数据库统计 ====
全部传染病总数：${total}
甲类：${a} 种｜乙类：${b} 种｜丙类：${c} 种
有可用疫苗的传染病：${vac} 种`;
}

// 2. 搜索疾病
function searchDisease(){
    let kw=document.getElementById("searchName").value.trim();
    let list=disease_db.filter(d=>d.name.includes(kw));
    if(list.length===0){
        document.getElementById("res-search").innerText="未找到匹配传染病，请更换关键词！";
        return;
    }
    let txt="";
    list.forEach(item=>{
        txt += `
==================== 疾病详情 ====================
疾病名称：${item.name}
分类：${item.category}传染病
病原体：${item.pathogen}
传播途径：${item.transmission}
典型症状：${item.symptom}
是否有疫苗：${item.has_vaccine?"✅是":"❌否"}
疫苗名称：${item.vaccine_name}
备注：${item.note}
`
    })
    document.getElementById("res-search").innerText = txt;
}

    let symStr=document.getElementById("symInput").value.trim();
    let symArr = symStr.split(" ").filter(x=>x!="");
    const textDom = document.getElementById("symTextResult");
    if(symArr.length === 0){
        clearPie();
        textDom.innerText="请输入症状！";
        return;
    }
    let match=[];
    for(let d of disease_db){
        //拆分该疾病的症状词
        let diseaseSymList = d.symptom.split(/、|，/).map(s=>s.trim()).filter(s=>s);
        let hitCount = 0;
        symArr.forEach(inputSym=>{
            diseaseSymList.forEach(ds=>{
                if(ds.includes(inputSym)) hitCount++;
            })
        })
        //计算百分比：命中症状 / 该疾病全部症状
        let percent = (hitCount / diseaseSymList.length *100).toFixed(1);
        if(hitCount>0){
            match.push({name:d.name,percent:Number(percent),vaccine:d.vaccine_name,hasVaccine:d.has_vaccine});
        }
    }
    if(match.length===0){
        clearPie();
        textDom.innerText="没有匹配传染病，请前往医院就诊！";
        return;
    }
    //按百分比降序排序，取前3绘制饼图
    match.sort((x,y)=>y.percent - x.percent);
    let top3 = match.slice(0,3);
    drawPie(top3);
    //文字说明
    let txt="🔍匹配到可能传染病：\n";
    top3.forEach((item,i)=>{
        txt+=`${i+1}. ${item.name}：${item.percent}% ${item.hasVaccine?("（疫苗："+item.vaccine+"）"):"（无疫苗）"}\n`;
    });
    txt+="\n⚠️本诊断仅供参考，不能替代医生诊断！";
    textDom.innerText=txt;
}

// 4. 疫苗接种统计 修复负数问题
function vaccCalc(){
    let d=disease_db[Number(diseaseSel.value)];
    let total=Number(document.getElementById("totalStu").value);
    let vacc=Number(document.getElementById("vaccStu").value);
    //校验：不能为空、负数，总人数>0
    if(isNaN(total)||isNaN(vacc)||total<=0||vacc<0){
        document.getElementById("res-vacc").innerText="❌输入错误：人数不能为负数，总人数必须大于0！";
        return;
    }
    if(vacc > total){
        document.getElementById("res-vacc").innerText="❌错误：已接种人数不能大于班级总人数！";
        return;
    }
    let rate=vacc/total*100;
    let barLen=Math.round(rate/5);
    let bar="█".repeat(barLen)+"-".repeat(20-barLen);
    const herd=70;
    let risk,maxInfect;
    if(rate>=herd){
        risk="低风险";
        maxInfect=0;
    }else{
        risk="较高风险";
        maxInfect = Math.max(0, Math.ceil(total * (herd - rate)/100));
    }
    document.getElementById("res-vacc").innerText = `==== 疫苗接种统计：${d.name} ====
疾病类别：${d.category}传染病
对应疫苗名称：${d.vaccine_name}${d.has_vaccine?"（有疫苗）":"（无疫苗）"}
✅班级接种率：${rate.toFixed(2)}%
接种率柱状图：
[${bar}] ${rate.toFixed(1)}%
群体免疫阈值：${herd}%
预估需要补齐免疫人数：${maxInfect}
风险等级：${risk}
防控建议：${d.has_vaccine?("加强"+d.vaccine_name+"接种宣传"):"该病无可用疫苗，重点做好防护与通风消毒"}，落实晨午检。
⚠️仅科普模型估算，**不能作为真实疫情评估依据**`;
}
